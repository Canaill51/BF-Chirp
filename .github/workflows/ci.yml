# Dependabot opens PRs that bump the actions in these workflows; without a test
# run on pull_request those PRs would be merged unread. This is what makes them
# reviewable — and the same run covers ordinary changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to a PR makes the first run pointless: drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is pyproject.toml's requires-python; the ceiling is the
        # newest release numpy and scipy publish wheels for. Both ends matter:
        # the floor is a promise, the ceiling is where breakage arrives first.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The dev extra pulls pytest and pandas; pandas is what the fast CSV
      # path uses, so installing it keeps that path covered rather than
      # silently skipped.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # No lint step on purpose: the project has no linter configured, so a
      # formatting check here would only report noise. See AGENTS.md.
      - name: Run tests
        run: python -m pytest

  # One stable context for the branch rule to require. Requiring the matrix
  # jobs directly would mean editing the rule every time a Python version is
  # added or dropped — and a rule that names a job which no longer exists
  # blocks every PR until someone notices.
  tests:
    name: tests
    needs: test
    if: always() # so a failed or cancelled matrix still reports, rather than skipping
    runs-on: ubuntu-latest
    steps:
      # A skipped job is not a passing one: check the result explicitly rather
      # than letting `needs` succeed by default.
      - name: Check matrix result
        if: needs.test.result != 'success'
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          exit 1
