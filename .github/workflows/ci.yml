# Dependabot opens PRs that bump the actions in these workflows; without a test
# run on pull_request those PRs would be merged unread. This is what makes them
# reviewable — and the same run covers ordinary changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to a PR makes the first run pointless: drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is pyproject.toml's requires-python; the ceiling is the
        # newest release numpy and scipy publish wheels for. Both ends matter:
        # the floor is a promise, the ceiling is where breakage arrives first.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The dev extra pulls pytest and pandas; pandas is what the fast CSV
      # path uses, so installing it keeps that path covered rather than
      # silently skipped.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # No lint step on purpose: the project has no linter configured, so a
      # formatting check here would only report noise. See AGENTS.md.
      - name: Run tests
        run: python -m pytest
