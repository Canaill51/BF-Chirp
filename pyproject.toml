[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfchirp"
version = "0.1.0"
description = "Analyse quantitative de logs Betaflight : bruit, réponse indicielle et identification fréquentielle par chirp"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["betaflight", "blackbox", "fpv", "chirp", "system-identification", "pid-tuning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
fast = ["pandas>=2.0"]
dev = ["pytest>=7.4", "pandas>=2.0"]

[project.scripts]
bfchirp = "bfchirp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
